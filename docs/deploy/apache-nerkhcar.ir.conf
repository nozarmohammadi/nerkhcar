<VirtualHost *:80>
    ServerName nerkhcar.ir
    ServerAlias www.nerkhcar.ir
    DocumentRoot /opt/nerkhcar/webapp
    <Directory /opt/nerkhcar/webapp>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass /api http://127.0.0.1:8790/api
    ProxyPassReverse /api http://127.0.0.1:8790/api
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog ${APACHE_LOG_DIR}/nerkhcar.ir-error.log
    CustomLog ${APACHE_LOG_DIR}/nerkhcar.ir-access.log combined
RewriteEngine on
RewriteCond %{SERVER_NAME} =nerkhcar.ir [OR]
RewriteCond %{SERVER_NAME} =www.nerkhcar.ir
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
